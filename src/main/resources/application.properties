spring.application.name=task-management-system

spring.datasource.url=jdbc:h2:file:./data/tms_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# Nur unkritische Actuator-Endpoints freigeben; shutdown bleibt deaktiviert.
management.endpoints.web.exposure.include=health,info

# Speicherort des RSA-Schluesselpaars fuer JWT (wird beim ersten Start erzeugt).
app.jwt.key-dir=./data/keys
